services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: itsm-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itsm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-itsm_secret_password_change_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-itsm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itsm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - itsm-network

  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: itsm-api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-itsm}:${POSTGRES_PASSWORD:-itsm_secret_password_change_in_production}@db:5432/${POSTGRES_DB:-itsm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_jwt_secret_in_production_minimum_32_characters}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - itsm-network
    restart: unless-stopped

  # Frontend (Vite dev server for development)
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: development
    container_name: itsm-web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "3001:5173"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages/shared:/app/packages/shared
    depends_on:
      - api
    networks:
      - itsm-network

  # Production Frontend (Nginx serving static files)
  web-prod:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: production
    container_name: itsm-web-prod
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - itsm-network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:

networks:
  itsm-network:
    driver: bridge
